<div class="contentDiv">
  <div class="heading_div">
    <div class="video-container" style="opacity: 1;">
      <video autoplay muted loop class="background-video" #bgVideo>
        <source src="https://www.everi.com/wp-content/uploads/2025/05/homepge.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <div class="autoplay-icon" (click)="toggleVideo(bgVideo)">
        <ng-container *ngIf="isPlaying; else playIcon">
          <!-- Pause Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="#ffffff">
            <circle cx="32" cy="32" r="30" stroke="#ffffff" stroke-width="2" fill="rgba(0,0,0,0.4)" />
            <rect x="22" y="20" width="8" height="24" fill="#ffffff" />
            <rect x="34" y="20" width="8" height="24" fill="#ffffff" />
          </svg>
        </ng-container>
        <ng-template #playIcon>
          <!-- Play Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="#ffffff">
            <circle cx="32" cy="32" r="30" stroke="#ffffff" stroke-width="2" fill="rgba(0,0,0,0.4)" />
            <polygon points="25,20 25,44 45,32" fill="#ffffff" />
          </svg>
        </ng-template>
      </div>


    </div>
    <div class="video-overlay">
          <h2 class="hero-slide-title" style="color: #ffffff; font-size: 4.375em;">TOGETHER <span style="font-weight:600">BUILT TO</span> WIN!</h2>
    </div>
  </div>
  <!-- <div class="carousel_div">
    <app-carousel [images]="bannerArr"></app-carousel>
  </div> -->
  <div class="flex-container prod_card_div">
    <ng-container *ngFor="let card of cardsArr">
      <app-card>
        <img class="prod_card_img" [src]="card.image" alt="Product Image" />
        <p class="prod_card_title">{{ card.title }}</p>
        <p class="prod_card_info">{{ card.content }}</p>
      </app-card>
    </ng-container>
  </div>
  <div class="article_div">
    <ng-container *ngFor="let article of articlesArr">
      <app-article [article]="article"></app-article>
    </ng-container>
  </div>
</div>
